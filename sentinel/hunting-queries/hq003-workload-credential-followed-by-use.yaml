schema_version: 1.0.0
id: 0aa4d671-b62a-451d-842f-5a566baaf103
name: Workload credential change followed by sign-in
description: Correlates a service-principal credential update with subsequent non-interactive sign-in activity.
status: READY_NOT_AUTHENTICATED
required_data_sources: [AuditLogs, AADServicePrincipalSignInLogs]
tactics: [Persistence, InitialAccess]
techniques: [T1098.001, T1078.004]
query: |-
  let CredentialChanges = AuditLogs
    | where TimeGenerated >= ago(7d) and Result =~ "success"
    | where OperationName has_any ("Add service principal credentials", "Add federated identity credential",
        "Update application - Certificates and secrets management")
    | mv-expand TargetResources
    | project CredentialTime=TimeGenerated, ServicePrincipalId=tostring(TargetResources.id),
        ServicePrincipalName=tostring(TargetResources.displayName), Actor=tostring(InitiatedBy.user.userPrincipalName);
  AADServicePrincipalSignInLogs
  | where TimeGenerated >= ago(7d) and ResultType == "0"
  | join kind=inner CredentialChanges on ServicePrincipalId
  | where TimeGenerated between (CredentialTime .. CredentialTime + 24h)
  | project TimeGenerated, CredentialTime, ServicePrincipalId, ServicePrincipalName, Actor,
      IPAddress, ResourceDisplayName, ConditionalAccessStatus
