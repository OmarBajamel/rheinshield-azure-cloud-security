schema_version: 1.0.0
id: 8c2f0d50-6e63-4db2-a53e-301c0bf6e012
name: RS012 Unusual mass object download or data-access spike
description: Detects one caller reading at least 100 distinct blobs or 100 MiB within ten minutes.
version: 1.0.0
kind: Scheduled
resource_type: Microsoft.SecurityInsights/alertRules
api_version: "2025-09-01"
enabled: false
severity: High
status: FIXTURE_VALIDATED
required_data_sources: [Azure StorageBlobLogs]
query_frequency: PT5M
query_period: PT15M
trigger_operator: GreaterThan
trigger_threshold: 0
suppression_enabled: false
suppression_duration: PT5H
tactics: [Collection, Exfiltration]
techniques: [T1530, T1567]
entity_mappings:
  - entity_type: IP
    field_mappings: [{identifier: Address, column_name: CallerIpAddress}]
  - entity_type: AzureResource
    field_mappings: [{identifier: ResourceId, column_name: _ResourceId}]
query: |-
  StorageBlobLogs
  | where TimeGenerated >= ago(15m) and StatusCode between (200 .. 299)
  | where OperationName in ("GetBlob", "GetBlobProperties", "ListBlobs")
  | summarize ObjectCount=dcount(Uri), RequestCount=count(), BytesReturned=sum(ResponseBodySize),
      SampleUris=make_set(Uri, 20), _ResourceId=any(_ResourceId)
      by AuthenticationType, RequesterObjectId, CallerIpAddress, AccountName, bin(TimeGenerated, 10m)
  | where ObjectCount >= 100 or BytesReturned >= 104857600
false_positives:
  - Backup, analytics, or migration jobs may legitimately read many objects.
tuning_guidance:
  - Establish workload-specific baselines and match approved job identities and schedules.
response_guidance:
  - Validate business purpose, restrict the identity or SAS, preserve access logs, and assess exposed data.
fixture: ../tests/fixtures/rs012-mass-object-download.json
evaluator: mass_object_download
expected_test_result: {baseline_alerts: 0, malicious_alerts: 1}
