schema_version: 1.0.0
id: 8c2f0d50-6e63-4db2-a53e-301c0bf6e009
name: RS009 Storage public access or network restriction weakened
description: Detects storage account writes whose captured request properties enable public access or change the network default action to Allow.
version: 1.0.0
kind: Scheduled
resource_type: Microsoft.SecurityInsights/alertRules
api_version: "2025-09-01"
enabled: false
severity: High
status: FIXTURE_VALIDATED
required_data_sources: [Azure Activity with request-body Properties]
query_frequency: PT5M
query_period: PT15M
trigger_operator: GreaterThan
trigger_threshold: 0
suppression_enabled: false
suppression_duration: PT5H
tactics: [DefenseEvasion, Exfiltration]
techniques: [T1562.007, T1537]
entity_mappings:
  - entity_type: Account
    field_mappings: [{identifier: FullName, column_name: Caller}]
  - entity_type: AzureResource
    field_mappings: [{identifier: ResourceId, column_name: ResourceId}]
query: |-
  AzureActivity
  | where TimeGenerated >= ago(15m) and ActivityStatusValue =~ "Success"
  | where OperationNameValue =~ "MICROSOFT.STORAGE/STORAGEACCOUNTS/WRITE"
  | extend RequestText=tolower(tostring(Properties))
  | where RequestText contains '"allowblobpublicaccess":true'
      or RequestText contains '"publicnetworkaccess":"enabled"'
      or RequestText contains '"defaultaction":"allow"'
  | project TimeGenerated, Caller, CallerIpAddress, ResourceId, SubscriptionId, ResourceGroup,
      CorrelationId, RequestText
false_positives:
  - An explicitly approved public-static-content account may intentionally permit public network access.
tuning_guidance:
  - Use a tightly governed watchlist of public-content accounts; do not suppress anonymous blob-access enablement.
response_guidance:
  - Verify data classification, restore network restrictions, inspect access logs, and rotate exposed secrets if applicable.
fixture: ../tests/fixtures/rs009-storage-public-access.json
evaluator: storage_public_access
expected_test_result: {baseline_alerts: 0, malicious_alerts: 1}
