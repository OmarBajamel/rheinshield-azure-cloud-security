schema_version: 1.0.0
id: 8c2f0d50-6e63-4db2-a53e-301c0bf6e008
name: RS008 Diagnostic or security monitoring control deleted
description: Detects successful deletion of diagnostic settings, Defender pricing configurations, or Log Analytics data exports.
version: 1.0.0
kind: Scheduled
resource_type: Microsoft.SecurityInsights/alertRules
api_version: "2025-09-01"
enabled: false
severity: High
status: FIXTURE_VALIDATED
required_data_sources: [Azure Activity]
query_frequency: PT5M
query_period: PT15M
trigger_operator: GreaterThan
trigger_threshold: 0
suppression_enabled: false
suppression_duration: PT5H
tactics: [DefenseEvasion]
techniques: [T1562.001]
entity_mappings:
  - entity_type: Account
    field_mappings: [{identifier: FullName, column_name: Caller}]
  - entity_type: AzureResource
    field_mappings: [{identifier: ResourceId, column_name: ResourceId}]
query: |-
  AzureActivity
  | where TimeGenerated >= ago(15m) and ActivityStatusValue =~ "Success"
  | where OperationNameValue in~ ("MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE",
      "MICROSOFT.SECURITY/PRICINGS/DELETE", "MICROSOFT.OPERATIONALINSIGHTS/WORKSPACES/DATAEXPORTS/DELETE",
      "MICROSOFT.INSIGHTS/DATACOLLECTIONRULES/DELETE")
  | project TimeGenerated, Caller, CallerIpAddress, ResourceId, OperationNameValue,
      SubscriptionId, ResourceGroup, CorrelationId
false_positives:
  - Planned resource retirement may delete its associated monitoring configuration.
tuning_guidance:
  - Correlate deletions with resource lifecycle tags and approved decommissioning changes.
response_guidance:
  - Confirm authorization, restore telemetry flow, identify coverage gaps, and review concurrent control changes.
fixture: ../tests/fixtures/rs008-monitoring-control-deleted.json
evaluator: monitoring_control_deleted
expected_test_result: {baseline_alerts: 0, malicious_alerts: 1}
