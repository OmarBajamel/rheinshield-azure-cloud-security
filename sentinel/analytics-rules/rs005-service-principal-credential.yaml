schema_version: 1.0.0
id: 8c2f0d50-6e63-4db2-a53e-301c0bf6e005
name: RS005 Credential added to service principal or application
description: Detects successful additions of passwords, keys, or federated credentials to workload identities.
version: 1.0.0
kind: Scheduled
resource_type: Microsoft.SecurityInsights/alertRules
api_version: "2025-09-01"
enabled: false
severity: High
status: FIXTURE_VALIDATED
required_data_sources: [Microsoft Entra ID AuditLogs]
query_frequency: PT5M
query_period: PT10M
trigger_operator: GreaterThan
trigger_threshold: 0
suppression_enabled: false
suppression_duration: PT5H
tactics: [Persistence, PrivilegeEscalation]
techniques: [T1098.001]
entity_mappings:
  - entity_type: Account
    field_mappings: [{identifier: FullName, column_name: InitiatedByAccount}]
query: |-
  AuditLogs
  | where TimeGenerated >= ago(10m) and Result =~ "success"
  | where OperationName in~ ("Add service principal credentials", "Update application - Certificates and secrets management",
      "Add federated identity credential", "Update service principal")
  | extend InitiatedByAccount=coalesce(tostring(InitiatedBy.user.userPrincipalName),
      tostring(InitiatedBy.app.displayName)), InitiatedByIp=tostring(InitiatedBy.user.ipAddress)
  | mv-expand TargetResources
  | extend WorkloadIdentity=tostring(TargetResources.displayName), ModifiedProperties=tostring(TargetResources.modifiedProperties)
  | where OperationName !~ "Update service principal" or ModifiedProperties has_any ("KeyDescription", "PasswordCredentials", "FederatedIdentityCredentials")
  | project TimeGenerated, OperationName, InitiatedByAccount, InitiatedByIp, WorkloadIdentity, CorrelationId
false_positives:
  - Approved key rotation or workload-identity federation onboarding produces expected events.
tuning_guidance:
  - Maintain an automation-window watchlist and never suppress changes by privileged interactive users.
response_guidance:
  - Validate the change ticket, inspect credential lifetime and issuer, and remove unapproved credentials.
fixture: ../tests/fixtures/rs005-service-principal-credential.json
evaluator: service_principal_credential
expected_test_result: {baseline_alerts: 0, malicious_alerts: 1}
