schema_version: 1.0.0
id: 8c2f0d50-6e63-4db2-a53e-301c0bf6e001
name: RS001 Password spray across multiple accounts
description: >-
  Detects one source address producing at least ten failed Entra sign-ins across
  five or more accounts in ten minutes. Successful and interrupted sign-ins are excluded.
version: 1.0.0
kind: Scheduled
resource_type: Microsoft.SecurityInsights/alertRules
api_version: "2025-09-01"
enabled: false
severity: High
status: FIXTURE_VALIDATED
required_data_sources: [Microsoft Entra ID SigninLogs]
query_frequency: PT5M
query_period: PT15M
trigger_operator: GreaterThan
trigger_threshold: 0
suppression_enabled: false
suppression_duration: PT5H
tactics: [CredentialAccess]
techniques: [T1110.003]
entity_mappings:
  - entity_type: IP
    field_mappings: [{identifier: Address, column_name: IPAddress}]
query: |-
  SigninLogs
  | where TimeGenerated >= ago(15m)
  | where ResultType !in ("0", "50074", "50158")
  | summarize FailedAttempts=count(), TargetedAccounts=dcount(UserPrincipalName),
      Accounts=make_set(UserPrincipalName, 25), FirstSeen=min(TimeGenerated),
      LastSeen=max(TimeGenerated) by IPAddress, bin(TimeGenerated, 10m)
  | where FailedAttempts >= 10 and TargetedAccounts >= 5
  | project TimeGenerated, IPAddress, FailedAttempts, TargetedAccounts, Accounts, FirstSeen, LastSeen
false_positives:
  - Misconfigured enterprise applications or shared egress proxies can create clustered failures.
tuning_guidance:
  - Exclude documented proxy addresses only after confirming account diversity and sign-in error codes.
response_guidance:
  - Correlate the source with successful sign-ins, revoke affected sessions, and review authentication methods.
fixture: ../tests/fixtures/rs001-password-spray.json
evaluator: password_spray
expected_test_result: {baseline_alerts: 0, malicious_alerts: 1}
