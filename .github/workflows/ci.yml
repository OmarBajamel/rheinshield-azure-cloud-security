name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
  python-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Strict typing for release-critical Python
        run: |
          for file in \
            apps/secure-workload/app/main.py \
            tools/compliance-export/generate.py \
            tools/detection-test-harness/validate.py \
            tools/evidence-collector/collect.py \
            tools/cost-gate/attest.py \
            tools/cost-gate/verify.py \
            tools/release/build_release.py \
            tools/sanitization/scan_dist.py \
            tools/sanitization/scan_public.py \
            tools/synthetic-telemetry/generate.py; do
            mypy "$file"
          done
      - run: python -m pytest -q
      - run: python tools/detection-test-harness/validate.py
      - run: python tools/sanitization/scan_public.py
      - run: pip-audit --skip-editable
      - name: Compile Sentinel Bicep templates
        run: |
          az bicep install --version v0.46.1
          for file in sentinel/automation-rules/*.bicep sentinel/playbooks/*.bicep sentinel/watchlists/*.bicep; do
            az bicep build --file "$file" --stdout >/dev/null
          done
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.0'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/lab init -backend=false
      - run: terraform -chdir=infra/lab validate
      - run: terraform -chdir=infra/lab test
      - run: terraform -chdir=infra/enterprise-reference init -backend=false
      - run: terraform -chdir=infra/enterprise-reference validate
      - run: terraform -chdir=infra/policies init -backend=false
      - run: terraform -chdir=infra/policies validate
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        with:
          tflint_version: v0.64.0
      - run: tflint --chdir=infra/lab --config "$GITHUB_WORKSPACE/.tflint.hcl" --recursive
      - name: Project IaC security gate
        run: python tools/iac-security/scan.py
