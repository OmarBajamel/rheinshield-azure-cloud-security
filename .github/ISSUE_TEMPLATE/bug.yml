name: Bug report
description: Report a reproducible RheinShield defect without private Azure data.
body:
  - type: markdown
    attributes:
      value: Never include tenant IDs, subscription IDs, account emails, tokens, or raw portal exports.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include mode, command, expected result, and sanitized output.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [public-demo, lab-live, enterprise-reference, private-evidence]
    validations:
      required: true
